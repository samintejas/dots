general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# Timeouts: dim at 5 min, lock at 15, blank the panel at 16.
#
# Order matters: the session must LOCK before the panel goes dark. Otherwise
# the laptop looks powered off while still unlocked, and any keypress drops
# straight into the session.

# 5 min — dim the backlight as a warning. Fully reversible.
listener {
    timeout    = 300
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# 15 min — lock.
listener {
    timeout    = 900
    on-timeout = loginctl lock-session
}

# 16 min — blank the panel, one minute after the lock is already up.
listener {
    timeout    = 960
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 5 hr — suspend.
listener {
    timeout    = 18000
    on-timeout = systemctl suspend
}
