general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# Timeouts are deliberately generous — this machine is often one of several in
# use at once and sits idle while work happens on another.
#
# Order matters: the session must LOCK before the panel goes dark. Otherwise
# the laptop looks powered off while still unlocked, and any keypress drops
# straight into the session.

# 10 min — dim the backlight as a warning. Fully reversible.
listener {
    timeout    = 600
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# 30 min — lock.
listener {
    timeout    = 1800
    on-timeout = loginctl lock-session
}

# 31 min — blank the panel, one minute after the lock is already up.
listener {
    timeout    = 1860
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 5 hr — suspend.
listener {
    timeout    = 18000
    on-timeout = systemctl suspend
}
