$background = rgba(0, 0, 0, 0)
$foreground = rgba(255, 255, 255, 1.0)
$muted      = rgba(88, 91, 112, 1.0)
$base       = rgba(10, 10, 10, 1.0)
$font       = GeistMono Nerd Font

general {
    ignore_empty_input = true
    hide_cursor        = true
}

background {
    monitor =
    color   = $base
}

# The clock's colon blinks once a second. It is the only moving thing on the
# screen, which is the point: a glance says the machine is awake, not hung.
label {
    monitor     =
    text        = cmd[update:500] ~/.config/hypr/scripts/lock-clock.sh
    font_family = $font
    font_size   = 96
    color       = $foreground
    position    = 0, 30
    halign      = center
    valign      = center
}

label {
    monitor     =
    text        = cmd[update:30000] date +"%A, %d %B"
    font_family = $font
    font_size   = 13
    color       = $muted
    position    = 0, -55
    halign      = center
    valign      = center
}

input-field {
    monitor           =
    size              = 400, 50
    rounding          = 3
    outline_thickness = 0
    hide_input        = false

    inner_color       = $background
    outer_color       = $background
    check_color       = $background

    dots_size         = 0.3
    dots_spacing      = 0.4
    dots_center       = true
    dots_rounding     = -1

    font_family       = $font
    font_color        = $foreground

    placeholder_text  = PASSCODE
    fail_text         = WRONG PASSCODE <b>($ATTEMPTS)</b>

    halign            = right
    valign            = bottom
}
