$background = rgba(0, 0, 0, 0)
$foreground = rgba(220, 220, 220, 1.0)
$muted      = rgba(158, 158, 158, 1.0)
$base       = rgba(8, 8, 8, 1.0)
$font       = GeistMono Nerd Font

general {
    ignore_empty_input = true
    hide_cursor        = true
}

background {
    monitor =
    color   = $base
}

# The clock's colon blinks once a second. It is the only moving thing on the
# screen, which is the point: a glance says the machine is awake, not hung.
label {
    monitor     =
    text        = cmd[update:500] ~/.config/hypr/scripts/lock-clock.sh
    font_family = $font
    font_size   = 96
    color       = $foreground
    position    = 0, 30
    halign      = center
    valign      = center
}

label {
    monitor     =
    text        = cmd[update:30000] date +"%A, %d %B" | tr "[:upper:]" "[:lower:]"
    font_family = $font
    font_size   = 13
    color       = $muted
    position    = 0, -55
    halign      = center
    valign      = center
}

# Dots TextField (v9): bg-field, 1px border-strong (3:1), pink while checking, danger on error
input-field {
    monitor           =
    size              = 320, 40
    rounding          = 3
    outline_thickness = 1
    hide_input        = false

    inner_color       = rgba(16, 16, 16, 1.0)
    outer_color       = rgba(112, 112, 112, 1.0)
    check_color       = rgba(240, 160, 220, 1.0)
    fail_color        = rgba(242, 85, 63, 1.0)
    capslock_color    = rgba(240, 177, 74, 1.0)

    dots_size         = 0.25
    dots_spacing      = 0.4
    dots_center       = true
    dots_rounding     = -1

    font_family       = $font
    font_color        = $foreground

    placeholder_text  = passcode
    fail_text         = wrong passcode ($ATTEMPTS)

    position          = 0, -110
    halign            = center
    valign            = center
}
