$background = rgba(0, 0, 0, 0)
$foreground = rgba(226, 226, 226, 1.0)
$muted      = rgba(156, 156, 156, 1.0)
$base       = rgba(6, 6, 6, 1.0)
$font       = GeistMono Nerd Font

general {
    ignore_empty_input = true
    hide_cursor        = true
}

background {
    monitor =
    color   = $base
}

# The clock's colon blinks once a second. It is the only moving thing on the
# screen, which is the point: a glance says the machine is awake, not hung.
label {
    monitor     =
    text        = cmd[update:500] ~/.config/hypr/scripts/lock-clock.sh
    font_family = $font
    font_size   = 96
    color       = $foreground
    position    = 0, 30
    halign      = center
    valign      = center
}

label {
    monitor     =
    text        = cmd[update:30000] date +"%A, %d %B" | tr "[:upper:]" "[:lower:]"
    font_family = $font
    font_size   = 13
    color       = $muted
    position    = 0, -55
    halign      = center
    valign      = center
}

# Dots TextField: inset well, 1px border-control, pink focus mark, red on error
input-field {
    monitor           =
    size              = 320, 36
    rounding          = 3
    outline_thickness = 1
    hide_input        = false

    inner_color       = rgba(33, 33, 33, 1.0)
    outer_color       = rgba(106, 106, 106, 1.0)
    check_color       = rgba(239, 156, 216, 1.0)
    fail_color        = rgba(243, 139, 168, 1.0)
    capslock_color    = rgba(250, 179, 135, 1.0)

    dots_size         = 0.25
    dots_spacing      = 0.4
    dots_center       = true
    dots_rounding     = -1

    font_family       = $font
    font_color        = $foreground

    placeholder_text  = passcode
    fail_text         = wrong passcode ($ATTEMPTS)

    position          = 0, -110
    halign            = center
    valign            = center
}
