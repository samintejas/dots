# Dots v9 — from the Dots design system tokens (grey structure, pink = current/selected).
# Сolor palette: https://stephango.com/flexoki
# ---
# black       "#080808" bg
# base-950    "#111111" bg-2
# base-900    "#292929" ui
# base-850    "#292929" ui-2
# base-800    "#383838" ui-3
# base-700    "#8a8a8a" tx-3
# base-500    "#9e9e9e" tx-2
# base-200    "#dcdcdc" tx
# red-400     "#f2553f" re
# orange-400  "#f0b14a" or
# yellow-400  "#f0b14a" ye
# yellow-600  "#f0b14a" ye-2
# green-400   "#5fcf7f" gr
# cyan-400    "#f0a0dc" cy
# cyan-600    "#f0a0dc" cy-2
# cyan-700    "#4d4d4d" cy-700
# cyan-900    "#281d26" cy-900
# blue-400    "#6aa8ff" bl
# purple-400  "#8a78f0" pu
# magenta-400 "#f0a0dc" ma

[app]
overall = { bg = "#080808" } # bg

[mgr]
cwd = { fg = "#dcdcdc", bold = true } # tx

# Find
find_keyword = { fg = "#f0a0dc", reversed = true } # cy
find_position = { fg = "#f0a0dc", bold = true } # cy

# Marker
marker_copied = { fg = "#5fcf7f", bg = "#5fcf7f" } # gr, gr
marker_cut = { fg = "#f2553f", bg = "#f2553f" } # re, re
marker_marked = { fg = "#4d4d4d", bg = "#4d4d4d" } # cy-700, cy-700
marker_selected = { fg = "#f0a0dc", bg = "#f0a0dc" } # cy, cy

# Count
count_copied = { fg = "#5fcf7f", bold = true, reversed = true } # gr
count_cut = { fg = "#f2553f", bold = true, reversed = true } # re
count_selected = { fg = "#f0a0dc", bold = true, reversed = true } # cy

# Border
border_symbol = "│"
border_style = { fg = "#292929" } # ui

[indicator]
parent = { underline = true }
current = { fg = "#dcdcdc", bg = "#292929" } # tx, ui
preview = { underline = true }
padding = { open = "█", close = "█" }

[tabs]
active = { fg = "#dcdcdc", bg = "#383838", bold = true } # tx, ui-3
inactive = { fg = "#9e9e9e", bg = "#292929" } # tx-2, ui
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
# Normal mode
normal_main = { fg = "#dcdcdc", bg = "#383838", bold = true } # tx, ui-3
normal_alt = { fg = "#9e9e9e", bg = "#292929" } # tx-2, ui

# Select mode
select_main = { fg = "#080808", bg = "#f0a0dc", bold = true } # bg, cy
select_alt = { fg = "#f0a0dc", bg = "#281d26" } # cy, cy-900

# Unset mode
unset_main = { fg = "#080808", bg = "#f0a0dc", bold = true } # bg, cy
unset_alt = { fg = "#f0a0dc", bg = "#281d26" } # cy, cy-900

[status]
overall = { fg = "#dcdcdc" } # tx

# Permissions
perm_type = { fg = "#6aa8ff" } # bl
perm_read = { fg = "#f0b14a" } # ye
perm_write = { fg = "#f2553f" } # re
perm_exec = { fg = "#5fcf7f" } # gr
perm_sep = { fg = "#9e9e9e" } # tx-2

# Progress
progress_label = { fg = "#080808" } # bg
progress_normal = { fg = "#f0a0dc", bg = "#4d4d4d" } # cy, cy-700
progress_error = { bg = "#f2553f" } # re

[which]
cols = 3
mask = { bg = "#111111" } # bg-2
cand = { fg = "#f0a0dc", bold = true } # cy
rest = { fg = "#f0a0dc" } # cy
desc = { fg = "#8a8a8a" } # tx-3
separator = " "
separator_style = { }

[confirm]
border = { fg = "#383838" } # ui-3
title = { fg = "#8a8a8a", bold = true } # tx-3
body = { fg = "#dcdcdc", bold = true } # tx
list = { fg = "#dcdcdc" } # tx
btn_yes = { fg = "#dcdcdc", bg = "#383838", bold = true } # tx, ui-3
btn_no = { fg = "#9e9e9e", bg = "#292929" } # tx-2, ui

[spot]
border = { fg = "#383838" } # ui-3
title = { fg = "#8a8a8a", bold = true } # tx-3
tbl_col = { fg = "#9e9e9e" } # tx-2
tbl_cell = { fg = "#dcdcdc", bg = "#292929" } # tx, ui

[notify]
# Notification title
title_info = { fg = "#6aa8ff" } # bl
title_warn = { fg = "#f0b14a" } # or
title_error = { fg = "#f2553f" } # re

[pick]
border = { fg = "#383838", bold = true } # ui-3
active = { fg = "#dcdcdc" } # tx
inactive = { fg = "#9e9e9e" } # tx-2

[input]
border = { fg = "#383838" } # ui-3
title = { fg = "#8a8a8a", bold = true } # tx-3
value = { fg = "#dcdcdc" } # tx
selected = { bg = "#111111" } # bg-2

[cmp]
border = { fg = "#383838", bold = true } # ui-3
active = { fg = "#dcdcdc", bg = "#292929" } # tx, ui
inactive = { fg = "#9e9e9e" } # tx-2

[tasks]
border = { fg = "#383838" } # ui-3
title = { fg = "#8a8a8a", bold = true } # tx-3
hovered = { fg = "#dcdcdc", bg = "#292929" } # tx, ui

[help]
on = { fg = "#6aa8ff" } # bl
run = { fg = "#f0a0dc" } # cy
desc = { fg = "#8a8a8a" } # tx-3
hovered = { bg = "#292929" } # ui
footer = { fg = "#080808", bg = "#f0a0dc", bold = true } # bg, cy

[filetype]
rules = [
  # Empty files
  { mime = "inode/empty", fg = "#8a8a8a" }, # tx-3

  # Special files
  { url = "*", is = "orphan", fg = "#8a8a8a" }, # tx-3
  { url = "*/", is = "orphan", fg = "#8a8a8a" }, # tx-3
  { url = "*", is = "link", fg = "#f0a0dc" }, # cy
  { url = "*/", is = "link", fg = "#f0a0dc" }, # cy
  { url = "*", is = "block", fg = "#dcdcdc" }, # tx
  { url = "*", is = "char", fg = "#dcdcdc" }, # tx
  { url = "*", is = "fifo", fg = "#f0a0dc" }, # ma
  { url = "*", is = "sock", fg = "#f0a0dc" }, # ma
  { url = "*", is = "sticky", fg = "#dcdcdc" }, # tx
  { url = "*", is = "dummy", fg = "#8a8a8a" }, # tx-3

  # Fallback
  { url = "*/", fg = "#dcdcdc" }, # tx
  { url = "*", is = "exec", fg = "#5fcf7f" }, # gr
  { url = "*", fg = "#9e9e9e" } # tx-2
]

[icon]
dirs = [
  { name = ".config", text = "", fg = "#f0a0dc" }, # cy
  { name = ".git", text = "", fg = "#f0a0dc" }, # cy
  { name = ".github", text = "", fg = "#f0a0dc" }, # cy
  { name = ".npm", text = "", fg = "#f0a0dc" }, # cy
  { name = "Desktop", text = "", fg = "#f0a0dc" }, # cy
  { name = "Development", text = "", fg = "#f0a0dc" }, # cy
  { name = "Documents", text = "", fg = "#f0a0dc" }, # cy
  { name = "Downloads", text = "", fg = "#f0a0dc" }, # cy
  { name = "Library", text = "", fg = "#f0a0dc" }, # cy
  { name = "Movies", text = "", fg = "#f0a0dc" }, # cy
  { name = "Music", text = "", fg = "#f0a0dc" }, # cy
  { name = "Pictures", text = "", fg = "#f0a0dc" }, # cy
  { name = "Public", text = "", fg = "#f0a0dc" }, # cy
  { name = "Videos", text = "", fg = "#f0a0dc" } # cy
]
conds = [
  # Special files
  { if = "orphan", text = "", fg = "#8a8a8a" }, # tx-3
  { if = "link", text = "", fg = "#f0a0dc" }, # cy
  { if = "block", text = "", fg = "#dcdcdc" }, # tx
  { if = "char", text = "", fg = "#dcdcdc" }, # tx
  { if = "fifo", text = "", fg = "#f0a0dc" }, # ma
  { if = "sock", text = "", fg = "#f0a0dc" }, # ma
  { if = "sticky", text = "", fg = "#dcdcdc" }, # tx
  { if = "dummy", text = "", fg = "#8a8a8a" }, # tx-3

  # Fallback
  { if = "dir", text = "", fg = "#f0a0dc" }, # cy
  { if = "exec", text = "", fg = "#5fcf7f" }, # gr
  { if = "!dir", text = "", fg = "#9e9e9e" } # tx-2
]